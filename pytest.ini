# Unit tests (pytest): small, isolated, no D-Bus or screen needed.
#   python3 -m pytest
# The end-to-end suites in tests/ (test_controller.py, test_launcher.py) are scripts
# that start fake services and a real GTK window; they are run on their own, see
# docs/development.md. testpaths keeps pytest from collecting (and running) them.
[pytest]
testpaths = tests/unit
addopts = -q
