# Publishes a release: Actions tab -> "Release" -> "Run workflow", type the version.
# Runs the checks and both test suites first; only then tags v<version> on the
# tested commit, builds htpc-launcher-<version>.tar.gz with its SHA256SUMS (the
# launcher's updater checks it before installing) and publishes them.
# The project is in beta: versions are 0.x, and any version with a suffix
# (0.1.0-beta.1, 0.2.0-rc.1...) is published as a pre-release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v; must match the VERSION file (e.g. 0.1.0-beta.6)"
        required: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Not a version: $VERSION" >&2; exit 1
          fi
          if [ "$VERSION" != "$(tr -d '[:space:]' < VERSION)" ]; then
            echo "The VERSION file says $(cat VERSION), not $VERSION" >&2; exit 1
          fi
          if ! grep -Fxq "__version__ = \"$VERSION\"" htpc/__init__.py; then
            echo "htpc/__init__.py's __version__ is not $VERSION" >&2; exit 1
          fi

      - name: Build the package and its checksum
        run: |
          git archive --format=tar.gz --prefix="htpc-launcher-$VERSION/" \
            -o "htpc-launcher-$VERSION.tar.gz" HEAD
          sha256sum "htpc-launcher-$VERSION.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=()
          TITLE="HTPC Launcher $VERSION"
          case "$VERSION" in
            0.*|*-*) FLAGS+=(--prerelease); TITLE="$TITLE (beta)" ;;
          esac
          gh release create "v$VERSION" "htpc-launcher-$VERSION.tar.gz" SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file .github/release-notes.md \
            "${FLAGS[@]}"
