# Publishes a release: Actions tab -> "Release" -> "Run workflow", type the version.
# Creates the v<version> tag on the latest main, builds htpc-launcher-<version>.tar.gz and attaches it.
# The project is in beta: versions are 0.x, and any version with a suffix
# (0.1.0-beta.1, 0.2.0-rc.1...) is published as a pre-release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v (beta: 0.1.0-beta.1, 0.1.0-beta.2...)"
        required: true
        default: "0.1.0-beta.4"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the package
        run: |
          VERSION="${{ inputs.version }}"
          git archive --format=tar.gz --prefix="htpc-launcher-$VERSION/" \
            -o "htpc-launcher-$VERSION.tar.gz" HEAD

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.version }}"
          FLAGS=()
          TITLE="HTPC Launcher $VERSION"
          case "$VERSION" in
            0.*|*-*) FLAGS+=(--prerelease); TITLE="$TITLE (beta)" ;;
          esac
          gh release create "v$VERSION" "htpc-launcher-$VERSION.tar.gz" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file .github/release-notes.md \
            "${FLAGS[@]}"
