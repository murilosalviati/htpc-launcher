# Checks and tests, on every push and pull request, and before every release.
name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install what the tests need
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-4.0 python3-evdev \
            python3-jeepney python3-pytest xvfb dbus dbus-x11 shellcheck
      - name: Unit tests (pytest)
        run: python3 -m pytest

      - name: Shell scripts (shellcheck)
        run: shellcheck install.sh */install.sh gnome-extension/test.sh

      - name: GNOME extension (syntax)
        run: |
          cp gnome-extension/htpc-launcher@htpc/extension.js /tmp/extension.mjs
          node --check /tmp/extension.mjs
          python3 -c "import json; m = json.load(open('gnome-extension/htpc-launcher@htpc/metadata.json')); assert m['uuid'] == 'htpc-launcher@htpc' and isinstance(m['version'], int)"

      - name: Controller tests
        run: dbus-run-session -- python3 tests/test_controller.py

      - name: Launcher tests
        run: |
          export HOME="$(mktemp -d)"
          python3 tests/make_test_home.py "$HOME"
          xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- python3 tests/test_launcher.py

  # The installers' packages on each family of distributions: scripts/packages.sh
  # must find and install GTK 4, python-evdev and jeepney with the distribution's
  # own package manager.
  distros:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            prepare: apt-get update && apt-get install -y python3
          - image: debian:trixie
            prepare: apt-get update && apt-get install -y python3
          - image: fedora:latest
            prepare: dnf install -y python3
          - image: archlinux:latest
            prepare: pacman -Syu --noconfirm python
          - image: opensuse/tumbleweed
            prepare: zypper --non-interactive install python3
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Python
        run: ${{ matrix.prepare }}
      - name: Packages through scripts/packages.sh
        shell: bash
        run: |
          . scripts/packages.sh
          echo "package manager: $(package_manager)"
          need_packages gtk evdev jeepney
      - name: Everything imports
        run: |
          python3 -c 'import gi; gi.require_version("Gtk", "4.0"); from gi.repository import Gtk; import evdev, jeepney; print("GTK", Gtk.get_major_version(), Gtk.get_minor_version())'
          python3 -m compileall -q htpc controller launcher
